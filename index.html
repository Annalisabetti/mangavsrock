<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga vs Rock - Cataloghi T-Shirt</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        .profile-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #ff4757;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 15px auto;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3);
        }
        h1 {
            font-size: 24px;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
        }
        .subtitle {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 30px;
        }
        .link-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #1e1e1e;
            color: white;
            padding: 16px 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border: 2px solid #2a2a2a;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        .link-button:hover {
            background-color: #2a2a2a;
            border-color: #ff4757;
            transform: translateY(-2px);
        }
        .link-button span {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .whatsapp {
            background-color: #25d366;
            border-color: #25d366;
            color: #000;
        }
        .whatsapp:hover {
            background-color: #20ba5a;
            border-color: #20ba5a;
        }
        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo o icona profilo -->
        <div class="profile-img">🎸</div>
        <h1>MANGA VS ROCK</h1>
        <p class="subtitle">T-Shirt personalizzate & stampe esclusive</p>

        <!-- Pulsante Catalogo Manga -->
        <a href="https://annalisabetti.github.io/catalogo-manga/catalogo.html" class="link-button" target="_blank">
            <span>🎌 Catalogo Manga / Anime</span>
            <span>➔</span>
        </a>

        <!-- Pulsante Catalogo Rock (da collegare quando crei il repo) -->
        <a href="#" class="link-button" target="_blank">
            <span>🎸 Catalogo Rock & Musica</span>
            <span>➔</span>
        </a>

        <!-- Contatto WhatsApp diretto -->
        <a href="https://wa.me/39TUONUMERO?text=Ciao!%20Ho%20visto%20i%20cataloghi%20online,%20vorrei%20informazioni%20su%20un'articolo." class="link-button whatsapp" target="_blank">
            <span>💬 Ordina / Info su WhatsApp</span>
            <span>➔</span>
        </a>

        <div class="footer">
            T-Shirt Express © 2026
        </div>
    </div>

</body>
</html>
